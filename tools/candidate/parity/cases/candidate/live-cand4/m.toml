# Model inputs for the real-model gates (inputs, never executables). The model is the one NEXT-PHASE-1 v5 was run on
# (sovereign-core docs/campaigns/next-phase-1/ACCEPTANCE-v5.md section 5, VERDICT-v5.md); digests re-checked on the
# Spark Hugging Face cache, snapshot 5a8abab4a5d6f164389b1079fb721cfab8d7126c, on 2026-10-06.
[model]
model-id = "unsloth/Llama-3.2-1B-Instruct"
snapshot = "5a8abab4a5d6f164389b1079fb721cfab8d7126c"
format = "safetensors, torch_dtype bfloat16"
model-safetensors-sha256 = "1ff795ff6a07e6a68085d206fb84417da2f083f68391c2843cd2b8ac6df8538f"
model-safetensors-bytes = "2471645608"
tokenizer-json-sha256 = "6b9e4e7fb171f92fd137b777cc2714bf87d11576700a1dcd7a399e7bbe39537b"
config-json-sha256 = "dfb67fd8afe73a1c75245824ef9d64a6ba8983025447e3bf76aa1ea57ee46152"
generation-config-json-sha256 = "6d4f979915331212d7672c68b22a4ddad9e21ed8126cf2bd1ea6b2b88f595c1c"
geometry = "LlamaForCausalLM: layers 16, hidden 2048, heads 32, kv heads 8, head_dim 64, intermediate 8192, vocab 128256, max positions 131072, rope_theta 500000.0 with llama3 rope scaling (factor 32, low 1, high 4, original 8192), rms_norm_eps 1e-05, tied embeddings"
licence = "Llama 3.2 Community License (Meta); not an OSI open-source licence. The AIEN code is AGPL-3.0-or-later; the model weights are not relicensed."
weights-distribution = "weights are NOT redistributed by AIEN; they are fetched from Hugging Face and accepted only by the digests above"
distribution = "internal-only: no release of CAND-4 outside the Spark until an open-licence model passes its own frozen campaign (Drake decision 2026-10-06, Option 3)"
oracle-fixture = "none recorded for this model: the CAND-3 oracle fixture (4707e3ba..., d9871e78...) belongs to TinyLlama and does not apply"

[toolchain]
rustc = "rustc 1.98.1 (48a229cea 2026-09-01), LLVM 22.1.8, host aarch64-unknown-linux-gnu"
cargo = "cargo 1.98.1 (797e8a9bc 2026-08-05)"
cc = "cc (Ubuntu 13.3.0-6ubuntu2~24.04.1) 13.3.0"
make = "GNU Make 4.3"
binutils = "GNU ld (GNU Binutils for Ubuntu) 2.42"
cross-cc = "aarch64-linux-gnu-gcc (Ubuntu 13.3.0-6ubuntu2~24.04.1) 13.3.0, for physics m2_build.sh and the aienos C kernel (host is aarch64)"
mojo = "not used by the default build"
rust-toolchain-file = "aien-sovereign-core rust-toolchain.toml at d5b78ff, sha256 887f9be066a15585a2c583578e84b0fcb541126d81546276bad3d2ff00d61167 (unchanged since CAND-3)"
source = "toolchain.txt in CAND4-BUILD-REAL3, written by cand4_build.sh before the build"

# What was built and how. Script: cand4_build.sh (copy in each evidence directory), adapted from cand3_build.sh.
[build]
physics = "./m2_build.sh, twice; physics.bin and atlas_m2.bin equal the committed files"
omega = "make -j6 PHYSICS_DIR=<physics worktree> OUT_DIR=build/rb all libomega_gpu; then one make per target with ARGUS_REPO and AIENOS_LOCK_REPO set: build/rb/{rx_operator,rx_r13_living_host,rx_r13_living_silicon,rx_r13_living_testbuild_silicon,rx_r11_aien_test,rx_composition_gate_gpu,rx_r15_perf_silicon,rx_r15_perf_silicon_nodigest,r15_reduce,librx_compose.a}; libomega_gpu.a carries no gate objects (G6)"
aien-sovereign-core = "cargo fetch --locked into a fresh CARGO_HOME, then scripts/release-build.sh --offline (six helper packages as one group, then aien-cli alone; sovereign-core #230) and scripts/repro-build.sh --offline -p aien-proof -p aien-test, AIEN_OMEGA_DIR and AIEN_PHYSICS_DIR set, AIEN_DEV_FALLBACK, AIEN_FORCE_CPU_STUB, AIEN_OMEGA_COMPOSE_LIB, AIEN_OMEGA_COMPOSE_SHA unset; native engine linked (has_omega_gpu), composition library linked (has_omega_compose), no cargo registry path in aien-cli (G13), zero-CUDA gate PASS"
aienos = "make -C native/kernel -j4, then make -C native/kernel -j4 full (core image and full image); no TEST-ONLY or rollback_test strings in either production image"
evidence = "Spark ~/workspace/evidence-out/CAND4-BUILD-REAL3 (summary.txt, digests.txt, toolchain.txt, per-item logs); refused attempts kept: CAND4-BUILD-REAL, CAND4-BUILD-REAL2"

[env]
AIEN_DEV_FALLBACK = "unset (production strict)"
AIEN_FORCE_CPU_STUB = "unset"
AIEN_OMEGA_DIR = "omega checkout at omega.lock, required for the native engine and composition library link"
AIEN_PHYSICS_DIR = "physics checkout at omega physics.lock"
AIEN_AIENOS_LOCK_REPO = "aienos clone holding omega aienos.lock b84c0a6 (input to librx_compose.a)"
AIEN_OMEGA_GPU_LIB = "unset (would link a prebuilt archive without a sha check)"
AIEN_MODEL_PATH = "model.safetensors of the [model] snapshot, with AIEN_TOKENIZER_PATH and AIEN_REQUIRE_CHECKPOINT=1"

[hardware]
machine = "spark-b87b, NVIDIA DGX Spark (GB10)"
gpu = "NVIDIA GB10, VBIOS 9A.0B.2D.00.00, driver 580.173.02"
kernel = "Linux 7.0.0-1019-nvidia, aarch64"
os = "Ubuntu 24.04.5 LTS"
memory = "127598752 kB"
gpu-load-note = "Builds were host only (no chip, no QEMU)."
