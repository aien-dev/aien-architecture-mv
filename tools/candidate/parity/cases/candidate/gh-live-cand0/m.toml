[toolchain]
rustc = "rustc 1.98.1 (48a229cea 2026-09-01), LLVM 22.1.8, host aarch64-unknown-linux-gnu"
cargo = "cargo 1.98.1 (797e8a9bc 2026-08-05)"
cc = "cc (Ubuntu 13.3.0-6ubuntu2~24.04.1) 13.3.0"
make = "GNU Make 4.3"
binutils = "GNU ld and ar 2.42 (Ubuntu)"
cross-cc = "aarch64-linux-gnu-gcc, for physics m2_build.sh and the aienos C kernel (host is aarch64)"
mojo = "Mojo 1.0.0 (ed45d567), a symlink into ~/max-env; used only by crates/spark-max-cabi/build.rs"
rust-toolchain-file = "none in any pinned repo (gap G4)"

# What was built and how. Paths are the L1-CAND worktrees under ~/workspace/overnight-1005.
[build]
physics = "./m2_build.sh (physics has no Makefile; omega compiles physics m16/nvrm sources directly). physics.bin and atlas_m2.bin rebuild byte for byte equal to the committed files."
omega = "make -j6 PHYSICS_DIR=<physics worktree> OUT_DIR=<omega worktree>/build all libomega_gpu"
aien-sovereign-core = "cargo build --release --locked --offline -p aien-cli -p aien-proof -p aien-test, default features (dev-fallback off), AIEN_OMEGA_DIR and AIEN_PHYSICS_DIR set, AIEN_DEV_FALLBACK and AIEN_FORCE_CPU_STUB unset"
release-profile = "opt-level 3, lto true, codegen-units 1, panic abort, strip true (workspace Cargo.toml)"
aienos = "make -C native/kernel -j4, then make -C native/kernel -j4 full (core image and full image)"
aien-cli-target-dir = "/home/drakestapleton/workspace/overnight-1005/target-L1-CAND-sc"
native-engine-linked = "cargo:rustc-cfg=has_omega_gpu printed by crates/aien-omega-gpu/build.rs; aien-cli carries the string OmegaGb10Backend (native Omega engine, no CUDA, NVIDIA GB10 sm_121)"

# Environment of the production configuration. Dev fallback is a recorded opt-in, never part of a strict run.
[env]
AIEN_DEV_FALLBACK = "unset (production strict); CI sets 1 for host test runs, which a strict receipt rejects"
AIEN_FORCE_CPU_STUB = "unset (would force the CPU stub library)"
AIEN_OMEGA_DIR = "omega checkout at omega.lock, required for the native engine link"
AIEN_PHYSICS_DIR = "physics checkout at omega physics.lock, required when physics is not at <omega>/../physics"
AIEN_OMEGA_GPU_LIB = "unset (would link a prebuilt archive without a sha check)"
AIEN_GPU_BACKEND = "omega demands the native backend at run time; AIEN_REQUIRE_BLACKWELL does the same"
AIEN_E2E_CHECKPOINT = "directory of the TinyLlama checkpoint for the real-model gates"
AIEN_MODEL_PATH = "safetensors file for aien-cli; with AIEN_TOKENIZER_PATH, AIEN_MODEL_DIR, AIEN_REQUIRE_CHECKPOINT=1 (no fallback to reference weights)"

[hardware]
machine = "spark-b87b, NVIDIA DGX Spark (GB10)"
gpu = "NVIDIA GB10, Blackwell, part 2E12-275-A1, VBIOS 9A.0B.2D.00.00, driver 580.173.02"
kernel = "Linux 7.0.0-1019-nvidia, aarch64"
os = "Ubuntu 24.04.5 LTS"
cpu = "20 cores: Cortex-X925 and Cortex-A725"
memory = "127598528 kB"
gpu-load-note = "The GPU was shared at freeze time (ollama llama-server, an atlas python process and MAX serve resident, util 94% per the campaign ledger). Chip timing taken under that load must say so."
