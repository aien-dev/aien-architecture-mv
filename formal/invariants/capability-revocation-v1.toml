schema_version = 0
id = "AIEN.INV.CAP.REVOCATION_CLOSURE.V1"
version = 1
status = "SEEDED"

statement = """
Once a capability is revoked, it is invalid, and every capability descended from it (its children, their \
children, and so on) is also invalid. An expired capability is invalid. Revoking a capability never makes \
its ancestors or unrelated capabilities invalid. Validity checks never turn an invalid capability into a \
valid one."""

assumptions = [
  "Cryptographic identity: the signature or MAC binding a capability to its fields is sound. Crypto correctness is not proven here.",
  "The capability graph is acyclic and parent links are recorded when a child is derived.",
  "Time is supplied by the caller as a single monotone-enough 'now' value; clock correctness is not covered.",
]

semantic_types = ["Capability", "CapabilityGraph", "RevocationSet", "Time"]

oracle_models = ["lean"]

evidence_requirements = [
  "positive corpus of valid capabilities staying valid after unrelated revocations",
  "negative corpus of revoked, descendant-of-revoked, and expired capabilities that must be refused",
  "deliberate mutant that skips descendant invalidation, which must not survive",
  "existing implementation unit tests keep passing",
]

required_counterexamples = ["revoked_token_accepted", "descendant_of_revoked_accepted", "expired_token_accepted"]

omega_takeover_condition = """
Omega expresses revocation reachability and expiry as native propositions, accepts the positive corpus, \
rejects the negative corpus, kills the required counterexample mutants, and emits a canonical proof/evidence \
identity that the gates consume, with Lean absent."""

[[positive_examples]]
name = "sibling_unaffected"
description = "Two children of one parent; one is revoked. The other remains valid."

[[positive_examples]]
name = "parent_unaffected"
description = "A child is revoked. Its parent remains valid."

[[negative_examples]]
name = "revoked_itself"
description = "A revoked token is refused."

[[negative_examples]]
name = "grandchild_of_revoked"
description = "Parent revoked after a grandchild was derived. The grandchild is refused."

[[negative_examples]]
name = "expired"
description = "Token with now greater than its valid_until is refused."

[[counterexamples]]
name = "revoked_token_accepted"
description = "A token in the revoked set passes validation."

[[counterexamples]]
name = "descendant_of_revoked_accepted"
description = "A token with a revoked ancestor passes validation."

[[counterexamples]]
name = "expired_token_accepted"
description = "A token past its expiry passes validation."

[[counterexamples]]
name = "revocation_resurrected"
description = "Re-deriving or re-issuing under an existing id clears a revocation."

[[implementation_surfaces]]
