[[observations]]
surface = "crates/aienos-aegis/src/capability.rs"
text = """
revoke(token_id) walks the recorded child map (a stack, no visited set, so it assumes a DAG) and inserts every \
reached id, including the starting id, into a revoked set. It does not check that the starting id exists; revoking \
an unknown id just records it. It is idempotent."""

[[observations]]
surface = "crates/aienos-aegis/src/capability.rs"
text = """
validate_token checks, in this order: own id in revoked set (TokenRevoked); every ancestor id reached by following \
parent_id through the graph's token map is in the revoked set (TokenRevoked); now_utc > valid_until_utc (TokenExpired); \
signature mismatch (InvalidSignature). The ancestor walk stops silently if an ancestor id is missing from the token map. \
So revocation is enforced twice: eagerly by revoke's descendant walk and lazily by the ancestor walk at validation."""

[[observations]]
surface = "crates/aienos-aegis/src/capability.rs"
text = """
Because the revocation check precedes the signature check, a token with a forged signature but a revoked id reports \
TokenRevoked, not InvalidSignature. Both are refusals. Expiry is inclusive: now == valid_until_utc is still valid."""

[[observations]]
surface = "crates/aienos-aegis/src/capability.rs"
text = """
validate_token validates only the token passed in plus revocation state of its ancestors. It does not re-check ancestors' expiry or \
signatures. In the current derive rule a child's expiry equals its parent's, so an expired ancestor implies an expired child."""

[[observations]]
surface = "crates/aienos-aegis/src/capability.rs"
text = """
derive_child_token inserts into the token map under child_id without checking for an existing entry and does not clear \
the revoked set. A re-derived child under a previously revoked id therefore stays revoked. Whether that is intended is not documented in the code read."""

[[observations]]
surface = "native/capability/aienos_capability.c"
text = """
Grep-level only. The C authority revokes by cascade over slots (cascade_revoke) and uses generation slots for reuse; \
its documented behavior is 'revoking an ancestor revokes the descendants'. Not audited line by line for this manifest."""

[[observations]]
surface = "PLAN.md section 9 versus code"
text = """
no divergence found for 'revocation rejects the revoked token', 'revocation invalidates descendants', 'expired capability is invalid' in the Rust code. \
The C model differs structurally (generation slots, '>=' expiry) and is recorded under the attenuation manifest."""
